      small { color: #ff6a00; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 22px 0 16px; font-size: clamp(48px, 10vw, 88px); line-height: .95; letter-spacing: -.05em; }
      p { max-width: 520px; color: #50545a; line-height: 1.7; }
      a { display: inline-flex; margin-top: 24px; padding: 14px 22px; border-radius: 999px; color: #fff; background: #ff6a00; font-weight: 700; text-decoration: none; }
    </style>
  </head>
